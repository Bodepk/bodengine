[package]
name = "lunar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hybrid 2D/3D game engine: Rust core, C++ public API, incremental milestones."
autoexamples = false

[workspace]
members = [
    "crates/lunar_math",
    "crates/lunar_ecs",
    "crates/lunar_core",
    "crates/lunar_platform",
    "crates/lunar_render",
    "crates/lunar_render2d",
    "crates/lunar_render3d",
    "crates/lunar_physics2d",
    "crates/lunar_physics3d",
    "crates/lunar_assets",
    "crates/lunar_audio",
    "crates/lunar_scenes",
    "crates/lunar_editor",
    "crates/lunar_editor_ui",
    "crates/lunar_bridge",
    "crates/lunar_runtime",
    "examples/minimal_game",
    "examples/scene_demo",
    "examples/sprite_platformer",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy_ecs = "0.20.1"
egui = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
cxx = "1.0.205"
cxx-build = "1.0.205"
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "guess_mime_type"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rapier2d = { version = "0.36.1", default-features = false, features = ["dim2", "f32", "std"] }
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
wgpu = "30.0.2"
winit = "0.30.13"
lunar_math = { path = "crates/lunar_math" }
lunar_ecs = { path = "crates/lunar_ecs" }
lunar_core = { path = "crates/lunar_core" }
lunar_platform = { path = "crates/lunar_platform", default-features = false }
lunar_render = { path = "crates/lunar_render" }
lunar_render2d = { path = "crates/lunar_render2d" }
lunar_render3d = { path = "crates/lunar_render3d" }
lunar_physics2d = { path = "crates/lunar_physics2d" }
lunar_physics3d = { path = "crates/lunar_physics3d" }
lunar_assets = { path = "crates/lunar_assets" }
lunar_audio = { path = "crates/lunar_audio" }
lunar_scenes = { path = "crates/lunar_scenes" }
lunar_editor = { path = "crates/lunar_editor" }
lunar_editor_ui = { path = "crates/lunar_editor_ui" }
lunar_bridge = { path = "crates/lunar_bridge" }
lunar_runtime = { path = "crates/lunar_runtime" }

[dependencies]
lunar_math = { workspace = true }
lunar_ecs = { workspace = true }
lunar_core = { workspace = true }
lunar_platform = { workspace = true }
lunar_render = { workspace = true, optional = true }
lunar_render2d = { workspace = true, optional = true }
lunar_render3d = { workspace = true, optional = true }
lunar_physics2d = { workspace = true, optional = true }
lunar_physics3d = { workspace = true, optional = true }
lunar_assets = { workspace = true, optional = true }
lunar_audio = { workspace = true, optional = true }
lunar_scenes = { workspace = true, optional = true }
lunar_editor = { workspace = true, optional = true }
lunar_editor_ui = { workspace = true, optional = true }
lunar_bridge = { workspace = true, optional = true }
lunar_runtime = { workspace = true, optional = true }

[features]
default = ["dim2", "dim3", "assets", "gltf", "audio", "scenes", "bridge", "runtime"]
render = ["dep:lunar_render", "lunar_platform/render"]
dim2 = ["render", "dep:lunar_render2d", "dep:lunar_physics2d"]
dim3 = ["render", "dep:lunar_render3d", "dep:lunar_physics3d"]
assets = ["dep:lunar_assets"]
gltf = ["assets", "lunar_assets/gltf"]
audio = ["dep:lunar_audio"]
scenes = ["dep:lunar_scenes"]
editor = ["dep:lunar_editor", "scenes"]
editor_ui = ["editor", "dep:lunar_editor_ui"]
bridge = ["dep:lunar_bridge"]
runtime = ["dep:lunar_runtime"]
