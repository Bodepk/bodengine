name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install audio system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: All-features check
        run: cargo check -p lunar --all-features
      - name: Configure C++ smoke
        run: cmake -S examples/cpp_smoke -B build/cpp_smoke
      - name: Build C++ smoke
        run: cmake --build build/cpp_smoke --config Release
      - name: Run C++ smoke
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            build/cpp_smoke/Release/cpp_smoke.exe
          else
            build/cpp_smoke/cpp_smoke
          fi

  feature-gates:
    name: 2D-only / 3D-only dependency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - name: 2D-only tree includes rapier2d and excludes 3D and assets
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features dim2 > tree-2d.txt
          grep -q 'rapier2d' tree-2d.txt
          ! grep -q 'rapier3d' tree-2d.txt
          ! grep -q 'lunar_render3d' tree-2d.txt
          ! grep -q 'lunar_physics3d' tree-2d.txt
          ! grep -q 'lunar_assets' tree-2d.txt
          ! grep -q 'gltf v' tree-2d.txt
          ! grep -q 'image v' tree-2d.txt
          ! grep -q 'rodio' tree-2d.txt
          ! grep -q 'cpal' tree-2d.txt
          ! grep -q 'lunar_scenes' tree-2d.txt
          ! grep -q 'serde_json' tree-2d.txt
          ! grep -q 'lunar_editor' tree-2d.txt
          ! grep -q 'lunar_editor_ui' tree-2d.txt
          ! grep -q 'egui v' tree-2d.txt
      - name: 3D-only tree includes rapier3d and excludes 2D and assets
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features dim3 > tree-3d.txt
          grep -q 'rapier3d' tree-3d.txt
          ! grep -q 'rapier2d' tree-3d.txt
          ! grep -q 'lunar_render2d' tree-3d.txt
          ! grep -q 'lunar_physics2d' tree-3d.txt
          ! grep -q 'lunar_assets' tree-3d.txt
          ! grep -q 'gltf v' tree-3d.txt
          ! grep -q 'image v' tree-3d.txt
          ! grep -q 'rodio' tree-3d.txt
          ! grep -q 'cpal' tree-3d.txt
          ! grep -q 'lunar_scenes' tree-3d.txt
          ! grep -q 'serde_json' tree-3d.txt
          ! grep -q 'lunar_editor' tree-3d.txt
          ! grep -q 'lunar_editor_ui' tree-3d.txt
          ! grep -q 'egui v' tree-3d.txt
      - name: No-default build excludes render, physics and assets
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features > tree-bare.txt
          ! grep -q 'lunar_render' tree-bare.txt
          ! grep -q 'wgpu' tree-bare.txt
          ! grep -q 'rapier' tree-bare.txt
          ! grep -q 'lunar_assets' tree-bare.txt
          ! grep -q 'gltf v' tree-bare.txt
          ! grep -q 'image v' tree-bare.txt
          ! grep -q 'rodio' tree-bare.txt
          ! grep -q 'cpal' tree-bare.txt
          ! grep -q 'lunar_scenes' tree-bare.txt
          ! grep -q 'serde_json' tree-bare.txt
          ! grep -q 'lunar_editor' tree-bare.txt
          ! grep -q 'lunar_editor_ui' tree-bare.txt
          ! grep -q 'egui v' tree-bare.txt
      - name: Assets-only tree includes image but excludes glTF
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features assets > tree-assets.txt
          grep -q 'lunar_assets' tree-assets.txt
          grep -q 'image v' tree-assets.txt
          ! grep -q 'gltf v' tree-assets.txt
      - name: glTF tree includes the pinned loader
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features gltf > tree-gltf.txt
          grep -q 'gltf v1.4.1' tree-gltf.txt
          grep -q 'image v' tree-gltf.txt
      - name: Audio tree includes the pinned player
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features audio > tree-audio.txt
          grep -q 'rodio v0.23.0' tree-audio.txt
          grep -q 'cpal' tree-audio.txt
      - name: Scenes tree includes the pinned serializers
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features scenes > tree-scenes.txt
          grep -q 'serde v1.0.229' tree-scenes.txt
          grep -q 'serde_json v1.0.154' tree-scenes.txt
          ! grep -q 'lunar_editor' tree-scenes.txt
          ! grep -q 'lunar_editor_ui' tree-scenes.txt
      - name: Default build leaves the editor and GUI out
        shell: bash
        run: |
          cargo tree -e features -p lunar > tree-default.txt
          ! grep -q 'lunar_editor' tree-default.txt
          ! grep -q 'lunar_editor_ui' tree-default.txt
          ! grep -q 'egui v' tree-default.txt
          ! grep -q 'eframe v' tree-default.txt
      - name: Editor tree includes the headless core but not the GUI
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features editor > tree-editor.txt
          grep -q 'lunar_editor' tree-editor.txt
          grep -q 'lunar_scenes' tree-editor.txt
          ! grep -q 'lunar_editor_ui' tree-editor.txt
          ! grep -q 'egui v' tree-editor.txt
          ! grep -q 'eframe v' tree-editor.txt
      - name: Editor UI tree includes egui and eframe
        shell: bash
        run: |
          cargo tree -e features -p lunar --no-default-features --features editor_ui > tree-editor-ui.txt
          grep -q 'lunar_editor v' tree-editor-ui.txt
          grep -q 'lunar_editor_ui v' tree-editor-ui.txt
          grep -q 'egui v0.37.0' tree-editor-ui.txt
          grep -q 'eframe v0.37.0' tree-editor-ui.txt
          grep -q 'egui-wgpu v0.37.0' tree-editor-ui.txt
          ! grep -q 'eframe feature "glow"' tree-editor-ui.txt
      - name: Sprite platformer tree uses 2D, assets and scenes only
        shell: bash
        run: |
          cargo tree -e features -p sprite_platformer > tree-platformer.txt
          grep -q 'rapier2d' tree-platformer.txt
          grep -q 'lunar_render v' tree-platformer.txt
          grep -q 'lunar_assets v' tree-platformer.txt
          grep -q 'lunar_scenes v' tree-platformer.txt
          ! grep -q 'rapier3d' tree-platformer.txt
          ! grep -q 'lunar_physics3d' tree-platformer.txt
          ! grep -q 'lunar_render3d' tree-platformer.txt
          ! grep -q 'rodio' tree-platformer.txt
          ! grep -q 'cpal' tree-platformer.txt
          ! grep -q 'lunar_bridge' tree-platformer.txt
          ! grep -q 'lunar_editor' tree-platformer.txt
          ! grep -q 'egui v' tree-platformer.txt
          ! grep -q 'eframe v' tree-platformer.txt
      - name: Partial builds compile
        shell: bash
        run: |
          cargo check -p lunar --no-default-features --features dim2
          cargo check -p lunar --no-default-features --features dim3
          cargo check -p lunar --no-default-features
          cargo check -p lunar --no-default-features --features scenes
          cargo check -p lunar --no-default-features --features editor
          cargo check -p lunar --no-default-features --features editor_ui
