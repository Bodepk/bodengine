[package]
name = "lunar_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "C++ bridge of the Lunar engine"
build = "build.rs"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
cxx.workspace = true
lunar_core.workspace = true
lunar_math.workspace = true
lunar_platform = { workspace = true, features = ["render"] }
lunar_render.workspace = true
lunar_physics2d.workspace = true
lunar_assets = { workspace = true, features = ["gltf"] }
lunar_audio.workspace = true
lunar_editor.workspace = true
lunar_physics3d.workspace = true
lunar_render3d = { workspace = true, features = ["gltf"] }
lunar_scenes.workspace = true

[build-dependencies]
cxx-build.workspace = true
